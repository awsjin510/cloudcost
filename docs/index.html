<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudCost — 多雲成本比較計算機</title>
  <meta name="description" content="即時比較 AWS、GCP、Azure、Oracle Cloud 雲端主機費用，找出最佳方案。免費、開源、無需登入。">
  <meta property="og:title" content="CloudCost — 多雲成本比較計算機">
  <meta property="og:description" content="即時比較 AWS / GCP / Azure / Oracle Cloud 雲端主機費用">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#9729;</text></svg>">
  <style>
:root {
  --bg: #0a0a0a;
  --surface: #141414;
  --text: #e8e0d0;
  --text-secondary: #b0a890;
  --text-muted: #706850;
  --primary: #d4a843;
  --primary-hover: #e0b84d;
  --primary-light: rgba(212,168,67,0.12);
  --border: #2a2520;
  --border-light: #1a1814;
  --success: #50c878;
  --success-bg: rgba(80,200,120,0.10);
  --warning: #e8a020;
  --warning-bg: rgba(232,160,32,0.10);
  --reserved: #b888e0;
  --reserved-bg: rgba(184,136,224,0.10);
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 1px 3px rgba(0,0,0,0.4), 0 1px 2px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 6px rgba(0,0,0,0.4), 0 2px 4px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 25px rgba(0,0,0,0.5);
  --header-bg: linear-gradient(135deg, #0f0d08 0%, #1a1508 50%, #0f0d08 100%);
}
html.dark {
  --bg: #050505;
  --surface: #0f0f0f;
  --text: #f0e8d8;
  --text-secondary: #c0b898;
  --text-muted: #807060;
  --primary: #e0b84d;
  --primary-hover: #f0c858;
  --primary-light: rgba(224,184,77,0.15);
  --border: #252018;
  --border-light: #151210;
  --success: #60d888;
  --success-bg: rgba(96,216,136,0.10);
  --warning: #f0b030;
  --warning-bg: rgba(240,176,48,0.10);
  --reserved: #c898f0;
  --reserved-bg: rgba(200,152,240,0.10);
  --shadow: 0 1px 3px rgba(0,0,0,0.5);
  --shadow-md: 0 4px 6px rgba(0,0,0,0.5);
  --shadow-lg: 0 10px 25px rgba(0,0,0,0.6);
  --header-bg: linear-gradient(135deg, #080604 0%, #121008 50%, #080604 100%);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh;
  transition: background 0.3s, color 0.3s;
}
header {
  background: var(--header-bg);
  border-bottom: 1px solid rgba(212,168,67,0.25);
  color: white; padding: 2.5rem 1rem 2rem; text-align: center; position: relative;
}
.header-inner { max-width: 960px; margin: 0 auto; }
.logo { display: flex; align-items: center; justify-content: center; gap: 0.6rem; }
.logo-icon { font-size: 2rem; }
.logo h1 {
  font-size: 2.2rem; font-weight: 800; letter-spacing: -0.03em;
  background: linear-gradient(135deg, #f0d070 0%, #d4a843 50%, #b8902a 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.tagline {
  color: #d4a843; margin-top: 0.75rem; font-size: 1.35rem; font-weight: 700;
  letter-spacing: 0.01em; line-height: 1.5;
}
.subtitle { color: #b0a890; margin-top: 0.5rem; font-size: 0.95rem; font-weight: 400; max-width: 600px; margin-left: auto; margin-right: auto; }
.header-actions { position: absolute; top: 1rem; right: 1rem; display: flex; gap: 0.5rem; }
.btn-icon {
  background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
  color: white; border-radius: 8px; padding: 0.45rem 0.7rem; cursor: pointer;
  font-size: 1rem; transition: all 0.2s; font-family: inherit;
}
.btn-icon:hover { background: rgba(255,255,255,0.2); }
main { max-width: 1080px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
section {
  background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border);
  padding: 1.5rem; margin-bottom: 1.25rem; box-shadow: var(--shadow);
  transition: background 0.3s, border-color 0.3s;
}
section h2 {
  font-size: 1.1rem; font-weight: 700; margin-bottom: 1rem; color: var(--text);
  display: flex; align-items: center; gap: 0.5rem;
}
section h2 .unit { font-size: 0.8rem; font-weight: 400; color: var(--text-muted); }
.presets-row { display: flex; gap: 0.75rem; overflow-x: auto; padding-bottom: 0.25rem; }
.preset-btn {
  flex: 1; min-width: 120px; display: flex; flex-direction: column; align-items: center; gap: 0.2rem;
  padding: 0.85rem 0.5rem; background: var(--surface); border: 2px solid var(--border);
  border-radius: var(--radius-sm); cursor: pointer; transition: all 0.2s; font-family: inherit; color: var(--text);
}
.preset-btn:hover { border-color: var(--primary); background: var(--primary-light); }
.preset-btn.active { border-color: var(--primary); background: var(--primary-light); box-shadow: 0 0 0 3px rgba(212,168,67,0.2); }
.preset-icon { font-size: 1.5rem; }
.preset-label { font-size: 0.85rem; font-weight: 700; color: var(--text); }
.preset-detail { font-size: 0.72rem; color: var(--text-muted); }
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(185px, 1fr)); gap: 1rem; }
.form-group { display: flex; flex-direction: column; }
label { font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 0.3rem; letter-spacing: 0.01em; }
label .unit { font-weight: 400; color: var(--text-muted); font-size: 0.75rem; }
input[type="number"], select {
  padding: 0.55rem 0.75rem; border: 1.5px solid var(--border); border-radius: 8px;
  font-size: 0.9rem; font-family: inherit; background: var(--surface); color: var(--text); transition: all 0.15s;
}
input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(212,168,67,0.15); }
.btn-compare {
  display: flex; align-items: center; justify-content: center; width: 100%; max-width: 320px;
  margin: 1.5rem auto 0; padding: 0.85rem 2rem;
  background: linear-gradient(135deg, #d4a843 0%, #b8902a 100%); color: #0a0a0a; border: none;
  border-radius: 10px; font-size: 1.05rem; font-weight: 700; cursor: pointer; transition: all 0.2s;
  box-shadow: 0 4px 14px rgba(212,168,67,0.3); font-family: inherit;
}
.btn-compare:hover { box-shadow: 0 6px 20px rgba(212,168,67,0.4); transform: translateY(-1px); }
.spec-summary { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.spec-summary span {
  background: var(--primary-light); color: var(--primary); padding: 0.3rem 0.85rem;
  border-radius: 100px; font-size: 0.8rem; font-weight: 600;
}
.price-chart { display: flex; flex-direction: column; gap: 0.9rem; }
.chart-row { display: grid; grid-template-columns: 140px 1fr 130px; align-items: center; gap: 0.75rem; }
.chart-row.cheapest .chart-price { color: var(--success); font-weight: 800; }
.chart-label { display: flex; flex-direction: column; gap: 0.1rem; }
.chart-provider { font-size: 0.95rem; font-weight: 800; }
.chart-label code {
  font-size: 0.72rem; color: var(--text-muted); background: var(--border-light);
  padding: 0.1rem 0.4rem; border-radius: 4px; display: inline-block; max-width: fit-content;
}
.chart-bar-track { height: 32px; background: var(--border-light); border-radius: 6px; overflow: hidden; }
.chart-bar { height: 100%; border-radius: 6px; transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1); min-width: 4px; }
.chart-price {
  text-align: right; font-family: "SF Mono","Fira Code","Cascadia Code",monospace;
  font-size: 1rem; font-weight: 700; color: var(--text);
}
.badge-cheapest {
  display: inline-block; padding: 0.15rem 0.6rem; border-radius: 100px;
  font-size: 0.7rem; font-weight: 700; background: var(--success); color: white; margin-left: 0.3rem; vertical-align: middle;
}
.badge-reserved {
  display: inline-block; padding: 0.15rem 0.6rem; border-radius: 100px;
  font-size: 0.7rem; font-weight: 700; background: var(--reserved); color: white; margin-left: 0.3rem; vertical-align: middle;
}
.provider-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; }
.provider-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 1.25rem; transition: all 0.2s; box-shadow: var(--shadow);
}
.provider-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }
.provider-card.card-cheapest { background: var(--success-bg); border-color: rgba(80,200,120,0.3); }
html.dark .provider-card.card-cheapest { border-color: rgba(80,200,120,0.25); }
.card-header { display: flex; align-items: center; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.5rem; }
.card-provider { font-size: 1.15rem; font-weight: 800; letter-spacing: -0.01em; }
.card-instance { margin-bottom: 0.15rem; }
.card-instance code { font-size: 0.78rem; background: var(--border-light); padding: 0.15rem 0.5rem; border-radius: 4px; color: var(--text-secondary); }
.card-region { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.85rem; }
.card-prices { display: flex; flex-direction: column; gap: 0.65rem; margin-bottom: 1rem; }
.card-price-block { padding: 0.75rem; background: var(--border-light); border-radius: var(--radius-sm); }
.card-price-block.reserved { background: var(--reserved-bg); }
.price-label { display: block; font-size: 0.72rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 0.2rem; }
.price-value { display: block; font-family: "SF Mono","Fira Code","Cascadia Code",monospace; font-size: 1.3rem; font-weight: 800; color: var(--text); }
.price-period { font-size: 0.75rem; font-weight: 500; color: var(--text-muted); }
.price-hourly { display: block; font-family: "SF Mono","Fira Code","Cascadia Code",monospace; font-size: 0.75rem; color: var(--text-muted); margin-top: 0.1rem; }
.saving { color: var(--success); font-weight: 700; font-size: 0.8rem; }
.card-breakdown { border-top: 1px solid var(--border); padding-top: 0.75rem; }
.breakdown-title { font-size: 0.72rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 0.4rem; }
.breakdown-row { display: flex; justify-content: space-between; padding: 0.2rem 0; font-size: 0.82rem; }
.breakdown-row span:first-child { color: var(--text-secondary); }
.breakdown-row span:last-child { font-family: "SF Mono","Fira Code","Cascadia Code",monospace; font-weight: 600; color: var(--text); }
.card-warnings { margin-top: 0.75rem; padding-top: 0.6rem; border-top: 1px solid var(--border); }
.card-warnings span { display: block; font-size: 0.78rem; color: var(--warning); line-height: 1.5; }

/* Share toast */
.toast {
  position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(100px);
  background: var(--text); color: var(--bg); padding: 0.75rem 1.5rem; border-radius: 10px;
  font-size: 0.9rem; font-weight: 600; box-shadow: var(--shadow-lg);
  opacity: 0; transition: all 0.3s ease; z-index: 999; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Share bar */
.share-bar {
  display: flex; align-items: center; gap: 0.75rem; margin-top: 1rem;
  padding: 0.75rem 1rem; background: var(--border-light); border-radius: var(--radius-sm);
}
.share-bar input {
  flex: 1; padding: 0.45rem 0.65rem; border: 1.5px solid var(--border); border-radius: 6px;
  font-size: 0.8rem; font-family: "SF Mono","Fira Code",monospace; background: var(--surface); color: var(--text);
}
.share-bar button {
  padding: 0.45rem 1rem; background: var(--primary); color: white; border: none;
  border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; font-family: inherit;
  white-space: nowrap;
}
.share-bar button:hover { background: var(--primary-hover); }

footer { text-align: center; padding: 2rem 1rem; color: var(--text-muted); font-size: 0.8rem; }
footer a { color: var(--primary); text-decoration: none; }
footer a:hover { text-decoration: underline; }

/* Mode tabs */
.mode-tabs {
  display: flex; gap: 0; margin-bottom: 1.25rem; border-radius: var(--radius);
  overflow: hidden; border: 1.5px solid var(--border); background: var(--surface);
}
.mode-tab {
  flex: 1; padding: 0.75rem 1rem; border: none; background: transparent;
  font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
  font-family: inherit; color: var(--text-secondary);
}
.mode-tab:hover { background: var(--border-light); }
.mode-tab.active {
  background: var(--primary); color: white;
}

/* Machine list */
.machine-list-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 0.75rem;
}
.machine-list-header h3 { font-size: 0.95rem; font-weight: 700; color: var(--text); }
.btn-add-machine {
  padding: 0.4rem 1rem; background: var(--primary); color: white; border: none;
  border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer;
  font-family: inherit; transition: all 0.2s;
}
.btn-add-machine:hover { background: var(--primary-hover); }
.machine-list-table { border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
.machine-list-thead, .machine-row {
  display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr 1.2fr 0.8fr;
  gap: 0.5rem; padding: 0.5rem 0.75rem; align-items: center;
}
.machine-list-thead {
  background: var(--border-light); font-size: 0.72rem; font-weight: 700;
  color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.03em;
}
.machine-row { border-top: 1px solid var(--border); }
.machine-row:first-child { border-top: none; }
.ml-input {
  width: 100%; padding: 0.4rem 0.5rem; border: 1.5px solid var(--border);
  border-radius: 6px; font-size: 0.82rem; font-family: inherit;
  background: var(--surface); color: var(--text);
}
.ml-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px rgba(212,168,67,0.12); }
.ml-col-actions { display: flex; gap: 0.3rem; }
.ml-btn {
  padding: 0.3rem 0.5rem; border: 1px solid var(--border); border-radius: 4px;
  background: var(--surface); cursor: pointer; font-size: 0.8rem; transition: all 0.15s;
}
.ml-btn:hover { background: var(--border-light); }
.ml-btn-delete:hover { background: rgba(220,80,80,0.1); border-color: rgba(220,80,80,0.4); }
.machine-summary {
  margin-top: 0.75rem; font-size: 0.85rem; color: var(--text-secondary);
  padding: 0.5rem 0.75rem; background: var(--border-light); border-radius: var(--radius-sm);
}
.machine-summary strong { color: var(--primary); }

/* Role badges */
.role-badge {
  display: inline-block; padding: 0.1rem 0.5rem; border-radius: 100px;
  font-size: 0.68rem; font-weight: 700; color: white; margin-right: 0.3rem;
}
.role-badge.role-web { background: rgba(59,130,246,0.8); }
.role-badge.role-api { background: rgba(80,200,120,0.8); }
.role-badge.role-db { background: rgba(212,168,67,0.8); }
.role-badge.role-cache { background: rgba(184,136,224,0.8); }
.role-badge.role-worker { background: rgba(220,80,80,0.8); }

/* Group card specifics */
.group-card { grid-column: 1 / -1; }
.group-card .provider-cards { grid-template-columns: 1fr; }
.machine-detail-row { display: flex; justify-content: space-between; align-items: center; padding: 0.35rem 0; font-size: 0.82rem; gap: 0.5rem; }
.machine-detail-row code { font-size: 0.72rem; color: var(--text-muted); background: var(--border-light); padding: 0.1rem 0.4rem; border-radius: 4px; }

@media (max-width: 768px) {
  header { padding: 1.5rem 1rem; }
  .logo h1 { font-size: 1.6rem; }
  .header-actions { top: 0.5rem; right: 0.5rem; }
  main { padding: 1rem 0.75rem 2rem; }
  section { padding: 1.25rem; }
  .presets-row { gap: 0.5rem; }
  .preset-btn { min-width: 90px; padding: 0.65rem 0.4rem; }
  .preset-icon { font-size: 1.2rem; }
  .preset-label { font-size: 0.78rem; }
  .form-grid { grid-template-columns: 1fr 1fr; gap: 0.75rem; }
  .chart-row { grid-template-columns: 90px 1fr 90px; gap: 0.5rem; }
  .chart-provider { font-size: 0.82rem; }
  .chart-price { font-size: 0.85rem; }
  .chart-bar-track { height: 24px; }
  .provider-cards { grid-template-columns: 1fr; }
  .machine-list-thead, .machine-row {
    grid-template-columns: 1.5fr 0.8fr 0.8fr 0.8fr 0.6fr 1fr 0.6fr;
    gap: 0.3rem; padding: 0.4rem 0.5rem; font-size: 0.75rem;
  }
  .ml-input { padding: 0.3rem 0.35rem; font-size: 0.78rem; }
}
@media (max-width: 480px) {
  .form-grid { grid-template-columns: 1fr; }
  .chart-row { grid-template-columns: 70px 1fr 80px; gap: 0.35rem; }
  .chart-label code { display: none; }
  .machine-list-thead { display: none; }
  .machine-row {
    grid-template-columns: 1fr 1fr; gap: 0.4rem; padding: 0.75rem;
    border-top: 2px solid var(--border);
  }
  .ml-col-actions { grid-column: 1 / -1; justify-content: flex-end; }
}
  </style>
</head>
<body>

  <header>
    <div class="header-actions">
      <button class="btn-icon" id="btn-dark" title="切換深色模式">&#9789;</button>
      <button class="btn-icon" id="btn-share" title="分享此配置">&#128279;</button>
    </div>
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">&#9729;</span>
        <h1>CloudCost</h1>
      </div>
      <p class="tagline">一鍵跨雲比價，找出最划算的雲端方案！</p>
      <p class="subtitle">CloudCost 支援 AWS, GCP, Azure, Oracle 即時費用計算，幫您告別繁瑣試算表，精準控管每一分預算。</p>
    </div>
  </header>

  <main>
    <!-- Mode tabs -->
    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="single">單台機器</button>
      <button class="mode-tab" data-mode="group">多台機器組合</button>
    </div>

    <!-- ==================== SINGLE MACHINE MODE ==================== -->
    <div id="single-mode">

    <section>
      <h2>快速方案</h2>
      <div class="presets-row">
        <button class="preset-btn" data-cpu="1" data-ram="2" data-storage="20" data-network="10">
          <span class="preset-icon">&#128187;</span>
          <span class="preset-label">入門</span>
          <span class="preset-detail">1 vCPU / 2 GB</span>
        </button>
        <button class="preset-btn" data-cpu="2" data-ram="8" data-storage="50" data-network="50">
          <span class="preset-icon">&#128421;</span>
          <span class="preset-label">開發</span>
          <span class="preset-detail">2 vCPU / 8 GB</span>
        </button>
        <button class="preset-btn active" data-cpu="4" data-ram="16" data-storage="100" data-network="100">
          <span class="preset-icon">&#9889;</span>
          <span class="preset-label">生產</span>
          <span class="preset-detail">4 vCPU / 16 GB</span>
        </button>
        <button class="preset-btn" data-cpu="8" data-ram="32" data-storage="500" data-network="500">
          <span class="preset-icon">&#128640;</span>
          <span class="preset-label">高效能</span>
          <span class="preset-detail">8 vCPU / 32 GB</span>
        </button>
        <button class="preset-btn" data-cpu="16" data-ram="64" data-storage="1000" data-network="1000">
          <span class="preset-icon">&#127981;</span>
          <span class="preset-label">企業</span>
          <span class="preset-detail">16 vCPU / 64 GB</span>
        </button>
      </div>
    </section>

    <section>
      <h2>自訂規格</h2>
      <form id="compare-form">
        <div class="form-grid">
          <div class="form-group">
            <label for="cpu_cores">CPU 核心數 <span class="unit">vCPU</span></label>
            <input type="number" id="cpu_cores" name="cpu_cores" min="1" max="512" value="4" required>
          </div>
          <div class="form-group">
            <label for="ram_gb">記憶體 <span class="unit">GB</span></label>
            <input type="number" id="ram_gb" name="ram_gb" min="0.5" max="12288" step="0.5" value="16" required>
          </div>
          <div class="form-group">
            <label for="storage_gb">儲存空間 <span class="unit">GB</span></label>
            <input type="number" id="storage_gb" name="storage_gb" min="0" max="65536" value="100">
          </div>
          <div class="form-group">
            <label for="storage_type">儲存類型</label>
            <select id="storage_type" name="storage_type">
              <option value="ssd" selected>SSD</option>
              <option value="hdd">HDD</option>
              <option value="nvme">NVME</option>
            </select>
          </div>
          <div class="form-group">
            <label for="network_transfer_gb">月出站流量 <span class="unit">GB</span></label>
            <input type="number" id="network_transfer_gb" name="network_transfer_gb" min="0" value="100">

// ════════════════════════════════════════════════════════════════
// CALCULATION ENGINE
// ════════════════════════════════════════════════════════════════

function matchInstance(catalog, cpu, ram) {
  const c = catalog.filter(i => i.vcpu >= cpu && i.ram >= ram).sort((a, b) => a.vcpu - b.vcpu || a.ram - b.ram);
  return c.length > 0 ? c[0] : catalog[catalog.length - 1];
}

function calcProvider(provider, spec) {
  let instances, prices, storagePrices, reservedDiscount, regionMult = 1, networkFn;
  switch (provider) {
    case 'aws':
      instances = AWS_INSTANCES; prices = AWS_PRICES; storagePrices = AWS_STORAGE;
      reservedDiscount = AWS_RESERVED_DISCOUNT; networkFn = awsNetworkCost;
      if (['ap-northeast-1','ap-northeast-2','ap-east-1'].includes(spec.region)) regionMult = 1.30;
      else if (['ap-southeast-1'].includes(spec.region)) regionMult = 1.15;
      else if (['eu-west-1'].includes(spec.region)) regionMult = 1.10;
      break;
    case 'gcp':
      instances = GCP_INSTANCES; prices = GCP_PRICES; storagePrices = GCP_STORAGE;
      reservedDiscount = GCP_RESERVED_DISCOUNT; regionMult = GCP_REGION_MULT[spec.region] || 1; networkFn = gcpNetworkCost;
      break;
    case 'azure':
      instances = AZURE_INSTANCES; prices = AZURE_PRICES; storagePrices = AZURE_STORAGE;
      reservedDiscount = AZURE_RESERVED_DISCOUNT; regionMult = AZURE_REGION_MULT[spec.region] || 1; networkFn = azureNetworkCost;
      break;
    case 'oracle':
      instances = ORACLE_INSTANCES; prices = ORACLE_PRICES; storagePrices = ORACLE_STORAGE;
      reservedDiscount = ORACLE_RESERVED_DISCOUNT; networkFn = oracleNetworkCost;
      break;
  }
  const inst = matchInstance(instances, spec.cpu_cores, spec.ram_gb);
  const baseHourly = (prices[inst.name] || 0.10) * regionMult;
  const computeCost = baseHourly * spec.monthly_hours;
  const storageCost = spec.storage_gb * (storagePrices[spec.storage_type] || storagePrices.ssd);
  const networkCost = networkFn(spec.network_transfer_gb);
  const totalOD = computeCost + storageCost + networkCost;
  const totalRes = computeCost * reservedDiscount + storageCost + networkCost;
  const warnings = [];
  if (inst.vcpu > spec.cpu_cores * 2) warnings.push('超額配置：可用的最小機型大於需求');
  if (inst.ram > spec.ram_gb * 2) warnings.push('記憶體超額配置');
  return {
    provider, region_name: REGION_NAMES[spec.region] || spec.region,
    matched_instance: inst.name,
    on_demand: { hourly_cost: baseHourly, monthly_cost: totalOD, details: { compute: computeCost, storage: storageCost, network: networkCost } },
    reserved_1y: { hourly_cost: baseHourly * reservedDiscount, monthly_cost: totalRes },
    total_monthly_on_demand: totalOD, total_monthly_reserved_1y: totalRes, warnings,
  };
}

function compare(spec) {
  const estimates = ['aws','gcp','azure','oracle'].map(p => calcProvider(p, spec));
  let cheapOD = estimates[0], cheapRes = estimates[0];
  for (const e of estimates) {
    if (e.total_monthly_on_demand < cheapOD.total_monthly_on_demand) cheapOD = e;
    if (e.total_monthly_reserved_1y < cheapRes.total_monthly_reserved_1y) cheapRes = e;
  }
  return { spec, estimates, cheapest_on_demand: cheapOD.provider, cheapest_reserved: cheapRes.provider };
}

// ════════════════════════════════════════════════════════════════

function specToParams(spec) {
  const p = new URLSearchParams();
  p.set('cpu', spec.cpu_cores); p.set('ram', spec.ram_gb);
  p.set('disk', spec.storage_gb); p.set('dtype', spec.storage_type);
  p.set('net', spec.network_transfer_gb); p.set('region', spec.region);
  p.set('hrs', spec.monthly_hours); p.set('os', spec.os);
  if (spec.database_type !== 'none') p.set('db', spec.database_type);
  return p.toString();
}

function paramsToSpec() {
  const p = new URLSearchParams(window.location.search);
  if (!p.has('cpu')) return null;
  return {
    cpu_cores: parseInt(p.get('cpu')) || 4,
    ram_gb: parseFloat(p.get('ram')) || 16,
    storage_gb: parseFloat(p.get('disk')) || 100,
    storage_type: p.get('dtype') || 'ssd',
    network_transfer_gb: parseFloat(p.get('net')) || 100,
    region: p.get('region') || 'ap-northeast-1',
    monthly_hours: parseFloat(p.get('hrs')) || 730,
    os: p.get('os') || 'linux',
    database_type: p.get('db') || 'none',
  };
}

function fillForm(spec) {
  document.getElementById('cpu_cores').value = spec.cpu_cores;
  document.getElementById('ram_gb').value = spec.ram_gb;
  document.getElementById('storage_gb').value = spec.storage_gb;
  document.getElementById('storage_type').value = spec.storage_type;
  document.getElementById('network_transfer_gb').value = spec.network_transfer_gb;
  document.getElementById('region').value = spec.region;
  document.getElementById('monthly_hours').value = spec.monthly_hours;
  document.getElementById('os_type').value = spec.os;
  document.getElementById('database_type').value = spec.database_type;
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
}

function generateShareURL(spec) {

// GROUP COMPARISON ENGINE
// ════════════════════════════════════════════════════════════════

const ROLE_LABELS = { web: 'Web', api: 'API', db: 'DB', cache: 'Cache', worker: 'Worker' };

function compareGroup(group) {
  const providers = ['aws','gcp','azure','oracle'];
  const estimates = providers.map(provider => {
    let totalOD = 0, totalRes = 0, totalMachines = 0;
    const allWarnings = [];
    const machineDetails = group.machines.map(m => {
      const spec = {
        cpu_cores: m.cpu, ram_gb: m.ram,
        storage_gb: m.storage, storage_type: group.storage_type,
        network_transfer_gb: 0, region: group.region,
        monthly_hours: group.monthly_hours, os: group.os,
        database_type: 'none',
      };
      const est = calcProvider(provider, spec);
      const unitOD = est.total_monthly_on_demand;
      const unitRes = est.total_monthly_reserved_1y;
      const subtotalOD = unitOD * m.quantity;
      const subtotalRes = unitRes * m.quantity;
      totalOD += subtotalOD;
      totalRes += subtotalRes;
      totalMachines += m.quantity;
      est.warnings.forEach(w => { if (!allWarnings.includes(w)) allWarnings.push(w); });
      return {
        machine: m,
        matched_instance: est.matched_instance,
        unit_monthly_on_demand: unitOD,
        unit_monthly_reserved_1y: unitRes,
        subtotal_on_demand: subtotalOD,
        subtotal_reserved_1y: subtotalRes,
      };
    });
    return {
      provider,
      region_name: REGION_NAMES[group.region] || group.region,
      machines: machineDetails,
      total_monthly_on_demand: totalOD,
      total_monthly_reserved_1y: totalRes,
      total_machines: totalMachines,
      warnings: allWarnings,
    };
  });
  let cheapOD = estimates[0], cheapRes = estimates[0];
  for (const e of estimates) {
    if (e.total_monthly_on_demand < cheapOD.total_monthly_on_demand) cheapOD = e;
    if (e.total_monthly_reserved_1y < cheapRes.total_monthly_reserved_1y) cheapRes = e;
  }
  return { group, estimates, cheapest_on_demand: cheapOD.provider, cheapest_reserved: cheapRes.provider };
}

// ════════════════════════════════════════════════════════════════
// UI LOGIC
// ════════════════════════════════════════════════════════════════

let lastSpec = null;
let currentMode = 'single';

// ── Mode tabs ──
document.querySelectorAll('.mode-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentMode = tab.dataset.mode;
    document.getElementById('single-mode').style.display = currentMode === 'single' ? '' : 'none';
    document.getElementById('group-mode').style.display = currentMode === 'group' ? '' : 'none';
    document.getElementById('results-container').style.display = 'none';
  });
});

// ── Preset buttons (single mode) ──
document.querySelectorAll('.preset-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('cpu_cores').value = btn.dataset.cpu;
    document.getElementById('ram_gb').value = btn.dataset.ram;
    document.getElementById('storage_gb').value = btn.dataset.storage;
    document.getElementById('network_transfer_gb').value = btn.dataset.network;
  });
});

// ── Single-machine form submit ──
document.getElementById('compare-form').addEventListener('submit', (e) => {
  e.preventDefault();
  lastSpec = {
    cpu_cores: parseInt(document.getElementById('cpu_cores').value) || 1,
    ram_gb: parseFloat(document.getElementById('ram_gb').value) || 1,
    storage_gb: parseFloat(document.getElementById('storage_gb').value) || 0,
    storage_type: document.getElementById('storage_type').value,
    network_transfer_gb: parseFloat(document.getElementById('network_transfer_gb').value) || 0,
    region: document.getElementById('region').value,
    monthly_hours: parseFloat(document.getElementById('monthly_hours').value) || 730,
    os: document.getElementById('os_type').value,
    database_type: document.getElementById('database_type').value,
  };
  renderResults(compare(lastSpec));
});

// ════════════════════════════════════════════════════════════════
// GROUP MODE: MACHINE LIST MANAGEMENT
// ════════════════════════════════════════════════════════════════

let machineIdCounter = 0;

function createMachineRow(preset) {
  machineIdCounter++;
  const id = 'machine-' + machineIdCounter;
  const p = preset || { name: '', cpu: 2, ram: 8, storage: 50, quantity: 1, role: 'web' };

  const row = document.createElement('div');
  row.className = 'machine-row';
  row.dataset.id = id;

  const roleOptions = ['web','api','db','cache','worker'].map(r =>
    '<option value="' + r + '"' + (r === p.role ? ' selected' : '') + '>' + (ROLE_LABELS[r] || r) + '</option>'
  ).join('');

  row.innerHTML =
    '<input type="text" class="ml-col ml-input" placeholder="例如：Web Server" value="' + (p.name || '') + '">' +
    '<input type="number" class="ml-col ml-input" min="1" max="512" value="' + p.cpu + '">' +
    '<input type="number" class="ml-col ml-input" min="0.5" max="12288" step="0.5" value="' + p.ram + '">' +
    '<input type="number" class="ml-col ml-input" min="0" max="65536" value="' + p.storage + '">' +
    '<input type="number" class="ml-col ml-input" min="1" max="1000" value="' + p.quantity + '">' +
    '<select class="ml-col ml-input">' + roleOptions + '</select>' +
    '<div class="ml-col ml-col-actions">' +
      '<button type="button" class="ml-btn ml-btn-clone" title="複製此機器">&#128203;</button>' +
      '<button type="button" class="ml-btn ml-btn-delete" title="刪除">&#128465;</button>' +
    '</div>';

  row.querySelector('.ml-btn-clone').addEventListener('click', () => {
    const inputs = row.querySelectorAll('.ml-input');
    const cloned = {
      name: inputs[0].value, cpu: parseInt(inputs[1].value),
      ram: parseFloat(inputs[2].value), storage: parseFloat(inputs[3].value),
      quantity: parseInt(inputs[4].value), role: inputs[5].value,
    };
    const newRow = createMachineRow(cloned);
    document.getElementById('machine-list-body').insertBefore(newRow, row.nextSibling);
    updateMachineSummary();
  });

  row.querySelector('.ml-btn-delete').addEventListener('click', () => {
    row.remove();
    updateMachineSummary();
  });

  row.querySelectorAll('.ml-input').forEach(input => {
    input.addEventListener('input', updateMachineSummary);
  });

  return row;
}

function updateMachineSummary() {
  const rows = document.querySelectorAll('#machine-list-body .machine-row');
  let total = 0;
  rows.forEach(row => {
    const qty = parseInt(row.querySelectorAll('.ml-input')[4].value) || 1;
    total += qty;
  });
  document.getElementById('machine-summary').innerHTML =
    '\u7E3D\u8A08\uFF1A<strong>' + total + '</strong> \u53F0\u6A5F\u5668\uFF08' + rows.length + ' \u7A2E\u898F\u683C\uFF09';
}

function getMachinesFromForm() {
  const rows = document.querySelectorAll('#machine-list-body .machine-row');
  const machines = [];
  rows.forEach(row => {
    const inputs = row.querySelectorAll('.ml-input');
    machines.push({
      id: row.dataset.id,
      name: inputs[0].value || ('Machine ' + row.dataset.id.split('-')[1]),
      cpu: parseInt(inputs[1].value) || 2,
      ram: parseFloat(inputs[2].value) || 8,
      storage: parseFloat(inputs[3].value) || 0,
      quantity: parseInt(inputs[4].value) || 1,
      role: inputs[5].value || 'web',
    });
  });
  return machines;
}

document.getElementById('btn-add-machine').addEventListener('click', () => {
  document.getElementById('machine-list-body').appendChild(createMachineRow());
  updateMachineSummary();
});

// Initialize with default machines
(function initDefaultMachines() {
  const defaults = [
    { name: 'Web Server',  cpu: 2, ram: 4,  storage: 50,  quantity: 2, role: 'web' },
    { name: 'API Server',  cpu: 4, ram: 16, storage: 100, quantity: 2, role: 'api' },
    { name: 'DB Server',   cpu: 4, ram: 32, storage: 500, quantity: 1, role: 'db' },
  ];
  const body = document.getElementById('machine-list-body');
  defaults.forEach(d => body.appendChild(createMachineRow(d)));
  updateMachineSummary();
})();

// ── Group form submit ──
document.getElementById('group-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const machines = getMachinesFromForm();
  if (machines.length === 0) { showToast('請至少新增一台機器'); return; }

  const group = {
    name: document.getElementById('group_name').value || 'My Workload',
    machines: machines,
    region: document.getElementById('group_region').value,
    storage_type: document.getElementById('group_storage_type').value,
    os: document.getElementById('group_os').value,
    monthly_hours: parseFloat(document.getElementById('group_hours').value) || 730,
  };

  renderGroupResults(compareGroup(group));
});

// ════════════════════════════════════════════════════════════════
// RENDER SINGLE-MACHINE RESULTS
// ════════════════════════════════════════════════════════════════

function renderResults(data) {
  const container = document.getElementById('results-container');
  container.style.display = '';
  const spec = data.spec;

  // Spec pills
  let pillsHTML = '<span>' + spec.cpu_cores + ' vCPU</span><span>' + spec.ram_gb + ' GB RAM</span>';
  if (spec.storage_gb > 0) pillsHTML += '<span>' + spec.storage_gb + ' GB ' + spec.storage_type.toUpperCase() + '</span>';
  if (spec.network_transfer_gb > 0) pillsHTML += '<span>' + spec.network_transfer_gb + ' GB \u6D41\u91CF</span>';
  pillsHTML += '<span>' + (REGION_NAMES[spec.region] || spec.region) + '</span><span>' + spec.os.toUpperCase() + '</span>';
  if (spec.database_type !== 'none') pillsHTML += '<span>DB: ' + spec.database_type + '</span>';
  document.getElementById('spec-pills').innerHTML = pillsHTML;

  const estimates = data.estimates.slice().sort((a, b) => a.total_monthly_on_demand - b.total_monthly_on_demand);
  const maxPrice = Math.max(...estimates.map(e => e.total_monthly_on_demand));

  // Bar chart
  document.getElementById('price-chart').innerHTML = estimates.map(est => {
    const meta = PROVIDER_META[est.provider];
    const pct = maxPrice > 0 ? (est.total_monthly_on_demand / maxPrice * 100) : 0;
    const isCheapest = est.provider === data.cheapest_on_demand;
    return '<div class="chart-row' + (isCheapest ? ' cheapest' : '') + '">' +
      '<div class="chart-label"><span class="chart-provider" style="color:' + meta.color + '">' + meta.name + '</span><code>' + est.matched_instance + '</code></div>' +
      '<div class="chart-bar-track"><div class="chart-bar" style="width:' + pct + '%;background:' + meta.color + '"></div></div>' +
      '<div class="chart-price">$' + est.total_monthly_on_demand.toFixed(2) + (isCheapest ? ' <span class="badge-cheapest">\u6700\u4F4E</span>' : '') + '</div>' +
    '</div>';
  }).join('');

  // Provider cards
  document.getElementById('provider-cards').innerHTML = estimates.map(est => {
    const meta = PROVIDER_META[est.provider];
    const isCheapest = est.provider === data.cheapest_on_demand;
    const isCheapestRes = est.provider === data.cheapest_reserved;
    const d = est.on_demand.details;
    const savePct = ((1 - est.total_monthly_reserved_1y / est.total_monthly_on_demand) * 100).toFixed(0);
    const warns = est.warnings.length > 0
      ? '<div class="card-warnings">' + est.warnings.map(w => '<span>&#9888; ' + w + '</span>').join('') + '</div>' : '';
    return '<div class="provider-card' + (isCheapest ? ' card-cheapest' : '') + '" style="border-top:3px solid ' + meta.color + '">' +
      '<div class="card-header">' +
        '<span class="card-provider" style="color:' + meta.color + '">' + meta.name + '</span>' +
        (isCheapest ? '<span class="badge-cheapest">On-Demand \u6700\u4F4E</span>' : '') +
        (isCheapestRes ? '<span class="badge-reserved">Reserved \u6700\u4F4E</span>' : '') +
      '</div>' +
      '<div class="card-instance"><code>' + est.matched_instance + '</code></div>' +
      '<div class="card-region">' + est.region_name + '</div>' +
      '<div class="card-prices">' +
        '<div class="card-price-block"><span class="price-label">On-Demand</span>' +
          '<span class="price-value">$' + est.total_monthly_on_demand.toFixed(2) + '<span class="price-period">/\u6708</span></span>' +
          '<span class="price-hourly">$' + est.on_demand.hourly_cost.toFixed(4) + '/hr</span></div>' +
        '<div class="card-price-block reserved"><span class="price-label">Reserved 1Y <span class="saving">-' + savePct + '%</span></span>' +
          '<span class="price-value">$' + est.total_monthly_reserved_1y.toFixed(2) + '<span class="price-period">/\u6708</span></span></div>' +
      '</div>' +
      '<div class="card-breakdown"><div class="breakdown-title">\u8CBB\u7528\u660E\u7D30</div>' +
        '<div class="breakdown-row"><span>Compute</span><span>$' + d.compute.toFixed(2) + '</span></div>' +
        (d.storage > 0 ? '<div class="breakdown-row"><span>Storage</span><span>$' + d.storage.toFixed(2) + '</span></div>' : '') +
        (d.network > 0 ? '<div class="breakdown-row"><span>Network</span><span>$' + d.network.toFixed(2) + '</span></div>' :
          est.provider === 'oracle' ? '<div class="breakdown-row"><span>Network</span><span style="color:var(--success)">$0.00 (首 10 TB 免費)</span></div>' : '') +
      '</div>' +
      warns +
    '</div>';
  }).join('');

  container.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ════════════════════════════════════════════════════════════════
// RENDER GROUP RESULTS
// ════════════════════════════════════════════════════════════════

function renderGroupResults(data) {
  const container = document.getElementById('results-container');
  container.style.display = '';
  const group = data.group;
  const totalQty = group.machines.reduce((s, m) => s + m.quantity, 0);

  // Spec pills
  let pillsHTML = '<span>' + group.name + '</span><span>' + totalQty + ' \u53F0\u6A5F\u5668</span><span>' + group.machines.length + ' \u7A2E\u898F\u683C</span>';
  pillsHTML += '<span>' + (REGION_NAMES[group.region] || group.region) + '</span><span>' + group.os.toUpperCase() + '</span>';
  group.machines.forEach(m => {
    pillsHTML += '<span>' + (m.name || m.id) + ': ' + m.cpu + 'C/' + m.ram + 'G x' + m.quantity + ' (' + (ROLE_LABELS[m.role] || m.role) + ')</span>';
  });
  document.getElementById('spec-pills').innerHTML = pillsHTML;

  const estimates = data.estimates.slice().sort((a, b) => a.total_monthly_on_demand - b.total_monthly_on_demand);
  const maxPrice = Math.max(...estimates.map(e => e.total_monthly_on_demand));

  // Bar chart
  document.getElementById('price-chart').innerHTML = estimates.map(est => {
    const meta = PROVIDER_META[est.provider];
    const pct = maxPrice > 0 ? (est.total_monthly_on_demand / maxPrice * 100) : 0;
    const isCheapest = est.provider === data.cheapest_on_demand;
    return '<div class="chart-row' + (isCheapest ? ' cheapest' : '') + '">' +
      '<div class="chart-label"><span class="chart-provider" style="color:' + meta.color + '">' + meta.name + '</span><code>' + est.total_machines + ' \u53F0</code></div>' +
      '<div class="chart-bar-track"><div class="chart-bar" style="width:' + pct + '%;background:' + meta.color + '"></div></div>' +
      '<div class="chart-price">$' + est.total_monthly_on_demand.toFixed(2) + (isCheapest ? ' <span class="badge-cheapest">\u6700\u4F4E</span>' : '') + '</div>' +
    '</div>';
  }).join('');

  // Provider cards with machine breakdown
  document.getElementById('provider-cards').innerHTML = estimates.map(est => {
    const meta = PROVIDER_META[est.provider];
    const isCheapest = est.provider === data.cheapest_on_demand;
    const isCheapestRes = est.provider === data.cheapest_reserved;
    let savePct = '';
    if (est.total_monthly_reserved_1y != null && est.total_monthly_on_demand > 0) {
      savePct = ((1 - est.total_monthly_reserved_1y / est.total_monthly_on_demand) * 100).toFixed(0);
    }

    // Machine breakdown
    const machinesHTML = est.machines.map(md => {
      const m = md.machine;
      const roleLabel = ROLE_LABELS[m.role] || m.role;
      return '<div class="breakdown-row machine-detail-row">' +
        '<span><span class="role-badge role-' + m.role + '">' + roleLabel + '</span> ' +
          (m.name || m.id) + ' <code>' + md.matched_instance + '</code></span>' +
        '<span>$' + md.unit_monthly_on_demand.toFixed(2) + ' x ' + m.quantity + ' = $' + md.subtotal_on_demand.toFixed(2) + '</span>' +
      '</div>';
    }).join('');

    const warnsHTML = est.warnings.length > 0
      ? '<div class="card-warnings">' + est.warnings.map(w => '<span>&#9888; ' + w + '</span>').join('') + '</div>' : '';

    return '<div class="provider-card group-card' + (isCheapest ? ' card-cheapest' : '') + '" style="border-top:3px solid ' + meta.color + '">' +
      '<div class="card-header">' +
        '<span class="card-provider" style="color:' + meta.color + '">' + meta.name + '</span>' +
        (isCheapest ? '<span class="badge-cheapest">On-Demand \u6700\u4F4E</span>' : '') +
        (isCheapestRes ? '<span class="badge-reserved">Reserved \u6700\u4F4E</span>' : '') +
      '</div>' +
      '<div class="card-region">' + est.region_name + ' \u2014 ' + est.total_machines + ' \u53F0\u6A5F\u5668</div>' +
      '<div class="card-prices">' +
        '<div class="card-price-block"><span class="price-label">ON-DEMAND \u7E3D\u8A08</span>' +
          '<span class="price-value">$' + est.total_monthly_on_demand.toFixed(2) + '<span class="price-period">/\u6708</span></span></div>' +
        (est.total_monthly_reserved_1y != null ? '<div class="card-price-block reserved"><span class="price-label">Reserved 1Y \u7E3D\u8A08 <span class="saving">-' + savePct + '%</span></span>' +
          '<span class="price-value">$' + est.total_monthly_reserved_1y.toFixed(2) + '<span class="price-period">/\u6708</span></span></div>' : '') +
      '</div>' +
      '<div class="card-breakdown"><div class="breakdown-title">\u6BCF\u53F0\u660E\u7D30</div>' + machinesHTML + '</div>' +
      warnsHTML +
    '</div>';
  }).join('');

  container.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ════════════════════════════════════════════════════════════════
// SHARE BUTTONS
// ════════════════════════════════════════════════════════════════

function doShare() {
  if (!lastSpec) { showToast('\u8ACB\u5148\u57F7\u884C\u6BD4\u8F03'); return; }
  const url = generateShareURL(lastSpec);
  const bar = document.getElementById('share-bar');
  const inp = document.getElementById('share-url');
  bar.style.display = 'flex';
  inp.value = url;
  inp.select();
  navigator.clipboard.writeText(url).then(() => showToast('\u5DF2\u8907\u88FD\u5206\u4EAB\u9023\u7D50!')).catch(() => {});
}
document.getElementById('btn-share').addEventListener('click', doShare);
document.getElementById('btn-share-results').addEventListener('click', doShare);
document.getElementById('btn-copy-url').addEventListener('click', () => {
  const inp = document.getElementById('share-url');
  inp.select();
  navigator.clipboard.writeText(inp.value).then(() => showToast('\u5DF2\u8907\u88FD\u5206\u4EAB\u9023\u7D50!'));
});

// On page load: restore from URL params or use defaults
const urlSpec = paramsToSpec();
if (urlSpec) {
  fillForm(urlSpec);
  lastSpec = urlSpec;
  renderResults(compare(urlSpec));
} else {
  document.getElementById('compare-form').dispatchEvent(new Event('submit'));
}

})();
</script>
