<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudCost — 多雲成本計算機</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">&#9729;</span>
        <h1>CloudCost</h1>
      </div>
      <p class="subtitle">AWS / GCP / Azure / Oracle Cloud 費用即時比較計算機</p>
    </div>
  </header>

  <main>
    <!-- Mode tabs -->
    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="single">單台機器</button>
      <button class="mode-tab" data-mode="group">多台機器組合</button>
    </div>

    <!-- ==================== SINGLE MACHINE MODE ==================== -->
    <div id="single-mode">

    <!-- Preset buttons -->
    <section class="presets-section">
      <h2>快速方案</h2>
      <div class="presets-row">
        <button class="preset-btn" data-cpu="1" data-ram="2" data-storage="20" data-network="10">
          <span class="preset-icon">&#128187;</span>
          <span class="preset-label">入門</span>
          <span class="preset-detail">1 vCPU / 2 GB</span>
        </button>
        <button class="preset-btn" data-cpu="2" data-ram="8" data-storage="50" data-network="50">
          <span class="preset-icon">&#128421;</span>
          <span class="preset-label">開發</span>
          <span class="preset-detail">2 vCPU / 8 GB</span>
        </button>
        <button class="preset-btn active" data-cpu="4" data-ram="16" data-storage="100" data-network="100">
          <span class="preset-icon">&#9889;</span>
          <span class="preset-label">生產</span>
          <span class="preset-detail">4 vCPU / 16 GB</span>
        </button>
        <button class="preset-btn" data-cpu="8" data-ram="32" data-storage="500" data-network="500">
          <span class="preset-icon">&#128640;</span>
          <span class="preset-label">高效能</span>
          <span class="preset-detail">8 vCPU / 32 GB</span>
        </button>
        <button class="preset-btn" data-cpu="16" data-ram="64" data-storage="1000" data-network="1000">
          <span class="preset-icon">&#127981;</span>
          <span class="preset-label">企業</span>
          <span class="preset-detail">16 vCPU / 64 GB</span>
        </button>
      </div>
    </section>

    <!-- Input form -->
    <section class="form-section">
      <h2>自訂規格</h2>
      <form id="compare-form">
        <div class="form-grid">
          <div class="form-group">
            <label for="cpu_cores">CPU 核心數 <span class="unit">vCPU</span></label>
            <input type="number" id="cpu_cores" name="cpu_cores" min="1" max="512" value="4" required>
          </div>

          <div class="form-group">
            <label for="ram_gb">記憶體 <span class="unit">GB</span></label>
            <input type="number" id="ram_gb" name="ram_gb" min="0.5" max="12288" step="0.5" value="16" required>
          </div>

          <div class="form-group">
            <label for="storage_gb">儲存空間 <span class="unit">GB</span></label>
            <input type="number" id="storage_gb" name="storage_gb" min="0" max="65536" value="100">
          </div>

          <div class="form-group">
            <label for="storage_type">儲存類型</label>
            <select id="storage_type" name="storage_type">
              {% for st in storage_types %}
              <option value="{{ st }}" {{ 'selected' if st == 'ssd' }}>{{ st | upper }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="form-group">
            <label for="network_transfer_gb">月出站流量 <span class="unit">GB</span></label>
            <input type="number" id="network_transfer_gb" name="network_transfer_gb" min="0" value="100">
          </div>

          <div class="form-group">
            <label for="region">部署區域</label>
            <select id="region" name="region">
              {% for val, label in regions %}
              <option value="{{ val }}" {{ 'selected' if val == 'ap-east-2' }}>{{ label }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="form-group">
            <label for="monthly_hours">每月時數 <span class="unit">hrs</span></label>
            <input type="number" id="monthly_hours" name="monthly_hours" min="0" max="744" step="1" value="730">
          </div>

          <div class="form-group">
            <label for="os_type">作業系統</label>
            <select id="os_type" name="os_type">
              <option value="linux" selected>Linux</option>
              <option value="windows">Windows</option>
            </select>
          </div>

          <div class="form-group">
            <label for="database_type">資料庫</label>
            <select id="database_type" name="database_type">
              {% for dt in db_types %}
              <option value="{{ dt }}" {{ 'selected' if dt == 'none' }}>
                {{ dt if dt != 'none' else '無' }}
              </option>
              {% endfor %}
            </select>
          </div>

          <div class="form-group checkbox-group">
            <label for="include_ai">
              <input type="checkbox" id="include_ai" name="include_ai">
              AI 智能建議
            </label>
          </div>
        </div>

        <div class="form-group full-width">
          <label for="description">使用場景描述 <span class="unit">供 AI 分析</span></label>
          <textarea id="description" name="description" rows="2"
                    placeholder="例如：台灣新創公司的 Web 應用，預計 1000 DAU，需要 PostgreSQL 資料庫"></textarea>
        </div>

        <button type="submit" class="btn-compare" id="btn-compare">
          <span class="btn-text">開始比較</span>
          <span class="btn-loading" style="display:none;">
            <span class="spinner"></span> 計算中...
          </span>
        </button>
      </form>
    </section>

    </div><!-- end single-mode -->

    <!-- ==================== GROUP MODE ==================== -->
    <div id="group-mode" style="display:none;">

    <section class="form-section">
      <h2>工作負載群組</h2>
      <form id="group-form">

        <!-- Group name -->
        <div class="form-grid" style="margin-bottom:1rem;">
          <div class="form-group">
            <label for="group_name">群組名稱</label>
            <input type="text" id="group_name" value="My Workload" style="padding:0.55rem 0.75rem;border:1.5px solid var(--border);border-radius:8px;font-size:0.9rem;font-family:inherit;">
          </div>
          <div class="form-group">
            <label for="group_region">部署區域</label>
            <select id="group_region">
              {% for val, label in regions %}
              <option value="{{ val }}" {{ 'selected' if val == 'ap-east-2' }}>{{ label }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="form-group">
            <label for="group_storage_type">儲存類型</label>
            <select id="group_storage_type">
              {% for st in storage_types %}
              <option value="{{ st }}" {{ 'selected' if st == 'ssd' }}>{{ st | upper }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="form-group">
            <label for="group_os">作業系統</label>
            <select id="group_os">
              <option value="linux" selected>Linux</option>
              <option value="windows">Windows</option>
            </select>
          </div>
          <div class="form-group">
            <label for="group_hours">每月時數</label>
            <input type="number" id="group_hours" min="0" max="744" value="730">
          </div>
          <div class="form-group checkbox-group">
            <label for="group_include_ai">
              <input type="checkbox" id="group_include_ai">
              AI 智能建議
            </label>
          </div>
        </div>

        <div class="form-group full-width">
          <label for="group_description">使用場景描述 <span class="unit">供 AI 分析</span></label>
          <textarea id="group_description" rows="2"
                    placeholder="例如：台灣電商平台，尖峰流量約 10,000 DAU，需要高可用資料庫"></textarea>
        </div>

        <!-- Machine list -->
        <div class="machine-list-header">
          <h3>機器清單</h3>
          <button type="button" class="btn-add-machine" id="btn-add-machine">+ 新增機器</button>
        </div>

        <div class="machine-list-table">
          <div class="machine-list-thead">
            <span class="ml-col ml-col-name">名稱</span>
            <span class="ml-col ml-col-cpu">CPU</span>
            <span class="ml-col ml-col-ram">RAM</span>
            <span class="ml-col ml-col-storage">儲存</span>
            <span class="ml-col ml-col-qty">數量</span>
            <span class="ml-col ml-col-role">角色</span>
            <span class="ml-col ml-col-actions">操作</span>
          </div>
          <div id="machine-list-body"></div>
        </div>

        <!-- Summary -->
        <div class="machine-summary" id="machine-summary">
          總計：<strong>0</strong> 台機器
        </div>

        <button type="submit" class="btn-compare" id="btn-group-compare">
          <span class="btn-text">開始比較</span>
          <span class="btn-loading" style="display:none;">
            <span class="spinner"></span> 計算中...
          </span>
        </button>
      </form>
    </section>

    </div><!-- end group-mode -->

    <!-- Results (hidden until submitted) -->
    <div id="results-container" style="display:none;">

      <!-- Spec summary -->
      <section class="summary-section">
        <h2>比較規格</h2>
        <div id="spec-pills" class="spec-summary"></div>
      </section>

      <!-- Price bar chart -->
      <section class="chart-section">
        <h2>價格總覽 <span class="unit">On-Demand 月費 (USD)</span></h2>
        <div id="price-chart" class="price-chart"></div>
      </section>

      <!-- Provider cards -->
      <section class="cards-section">
        <h2>詳細比較</h2>
        <div id="provider-cards" class="provider-cards"></div>
      </section>

      <!-- AI recommendation -->
      <section id="ai-section" class="ai-section" style="display:none;">
        <h2>AI 智能建議</h2>
        <div id="ai-content" class="ai-content"></div>
      </section>

    </div>
  </main>

  <footer>
    <p>CloudCost v0.6 — 定價資料僅供參考，實際費用以各雲端官方為準</p>
  </footer>

{% if result %}
<!-- Server-side result data for form POST fallback -->
<script id="ssr-data" type="application/json">{{ result.model_dump_json() | safe }}</script>
{% endif %}

<script>
(function() {
  const PROVIDER_META = {
    aws:    { name: 'AWS',    color: '#ff9900', bg: '#fff8ee' },
    gcp:    { name: 'GCP',    color: '#4285f4', bg: '#eef4ff' },
    azure:  { name: 'Azure',  color: '#0078d4', bg: '#eef6ff' },
    oracle: { name: 'Oracle', color: '#c74634', bg: '#fef0ee' },
  };

  const ROLE_LABELS = { web: 'Web', api: 'API', db: 'DB', cache: 'Cache', worker: 'Worker' };

  // ======== Mode Tabs ========
  let currentMode = 'single';
  document.querySelectorAll('.mode-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentMode = tab.dataset.mode;
      document.getElementById('single-mode').style.display = currentMode === 'single' ? '' : 'none';
      document.getElementById('group-mode').style.display = currentMode === 'group' ? '' : 'none';
      document.getElementById('results-container').style.display = 'none';
    });
  });

  // ======== Preset buttons (single mode) ========
  document.querySelectorAll('.preset-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('cpu_cores').value = btn.dataset.cpu;
      document.getElementById('ram_gb').value = btn.dataset.ram;
      document.getElementById('storage_gb').value = btn.dataset.storage;
      document.getElementById('network_transfer_gb').value = btn.dataset.network;
    });
  });

  // ======== Single-machine form submit ========
  document.getElementById('compare-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn-compare');
    const btnText = btn.querySelector('.btn-text');
    const btnLoad = btn.querySelector('.btn-loading');
    btn.disabled = true;
    btnText.style.display = 'none';
    btnLoad.style.display = 'inline-flex';

    const body = {
      cpu_cores:           parseInt(document.getElementById('cpu_cores').value),
      ram_gb:              parseFloat(document.getElementById('ram_gb').value),
      storage_gb:          parseFloat(document.getElementById('storage_gb').value) || 0,
      storage_type:        document.getElementById('storage_type').value,
      network_transfer_gb: parseFloat(document.getElementById('network_transfer_gb').value) || 0,
      database_type:       document.getElementById('database_type').value,
      region:              document.getElementById('region').value,
      monthly_hours:       parseFloat(document.getElementById('monthly_hours').value) || 730,
      os:                  document.getElementById('os_type').value,
      description:         document.getElementById('description').value,
      include_ai:          document.getElementById('include_ai').checked,
    };

    try {
      const resp = await fetch('/api/compare', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (!resp.ok) throw new Error('API Error ' + resp.status);
      const data = await resp.json();
      renderResults(data);
    } catch (err) {
      alert('比較失敗：' + err.message);
    } finally {
      btn.disabled = false;
      btnText.style.display = 'inline';
      btnLoad.style.display = 'none';
    }
  });

  // ======== Group mode: machine list management ========
  let machineIdCounter = 0;
  const machineRoles = {{ machine_roles | tojson }};

  function createMachineRow(preset) {
    machineIdCounter++;
    const id = 'machine-' + machineIdCounter;
    const p = preset || { name: '', cpu: 2, ram: 8, storage: 50, quantity: 1, role: 'web' };

    const row = document.createElement('div');
    row.className = 'machine-row';
    row.dataset.id = id;

    const roleOptions = machineRoles.map(r =>
      `<option value="${r}" ${r === p.role ? 'selected' : ''}>${ROLE_LABELS[r] || r}</option>`
    ).join('');

    row.innerHTML = `
      <input type="text" class="ml-col ml-col-name ml-input" placeholder="例如：Web Server" value="${p.name}">
      <input type="number" class="ml-col ml-col-cpu ml-input" min="1" max="512" value="${p.cpu}">
      <input type="number" class="ml-col ml-col-ram ml-input" min="0.5" max="12288" step="0.5" value="${p.ram}">
      <input type="number" class="ml-col ml-col-storage ml-input" min="0" max="65536" value="${p.storage}">
      <input type="number" class="ml-col ml-col-qty ml-input" min="1" max="1000" value="${p.quantity}">
      <select class="ml-col ml-col-role ml-input">${roleOptions}</select>
      <div class="ml-col ml-col-actions">
        <button type="button" class="ml-btn ml-btn-clone" title="複製此機器">&#128203;</button>
        <button type="button" class="ml-btn ml-btn-delete" title="刪除">&#128465;</button>
      </div>
    `;

    // Clone button
    row.querySelector('.ml-btn-clone').addEventListener('click', () => {
      const inputs = row.querySelectorAll('.ml-input');
      const cloned = {
        name: inputs[0].value,
        cpu: parseInt(inputs[1].value),
        ram: parseFloat(inputs[2].value),
        storage: parseFloat(inputs[3].value),
        quantity: parseInt(inputs[4].value),
        role: inputs[5].value,
      };
      const newRow = createMachineRow(cloned);
      document.getElementById('machine-list-body').insertBefore(newRow, row.nextSibling);
      updateMachineSummary();
    });

    // Delete button
    row.querySelector('.ml-btn-delete').addEventListener('click', () => {
      row.remove();
      updateMachineSummary();
    });

    // Live update summary on input change
    row.querySelectorAll('.ml-input').forEach(input => {
      input.addEventListener('input', updateMachineSummary);
    });

    return row;
  }

  function updateMachineSummary() {
    const rows = document.querySelectorAll('#machine-list-body .machine-row');
    let total = 0;
    rows.forEach(row => {
      const qty = parseInt(row.querySelectorAll('.ml-input')[4].value) || 1;
      total += qty;
    });
    document.getElementById('machine-summary').innerHTML =
      `總計：<strong>${total}</strong> 台機器（${rows.length} 種規格）`;
  }

  function getMachinesFromForm() {
    const rows = document.querySelectorAll('#machine-list-body .machine-row');
    const machines = [];
    rows.forEach(row => {
      const inputs = row.querySelectorAll('.ml-input');
      machines.push({
        id: row.dataset.id,
        name: inputs[0].value || ('Machine ' + row.dataset.id.split('-')[1]),
        cpu: parseInt(inputs[1].value) || 2,
        ram: parseFloat(inputs[2].value) || 8,
        storage: parseFloat(inputs[3].value) || 0,
        quantity: parseInt(inputs[4].value) || 1,
        role: inputs[5].value || 'web',
      });
    });
    return machines;
  }

  // Add machine button
  document.getElementById('btn-add-machine').addEventListener('click', () => {
    const body = document.getElementById('machine-list-body');
    body.appendChild(createMachineRow());
    updateMachineSummary();
  });

  // Initialize with default machines
  (function initDefaultMachines() {
    const defaults = [
      { name: 'Web Server',  cpu: 2, ram: 4,  storage: 50,  quantity: 2, role: 'web' },
      { name: 'API Server',  cpu: 4, ram: 16, storage: 100, quantity: 2, role: 'api' },
      { name: 'DB Server',   cpu: 4, ram: 32, storage: 500, quantity: 1, role: 'db' },
    ];
    const body = document.getElementById('machine-list-body');
    defaults.forEach(d => body.appendChild(createMachineRow(d)));
    updateMachineSummary();
  })();

  // ======== Group form submit ========
  document.getElementById('group-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const machines = getMachinesFromForm();
    if (machines.length === 0) { alert('請至少新增一台機器'); return; }

    const btn = document.getElementById('btn-group-compare');
    const btnText = btn.querySelector('.btn-text');
    const btnLoad = btn.querySelector('.btn-loading');
    btn.disabled = true;
    btnText.style.display = 'none';
    btnLoad.style.display = 'inline-flex';

    const body = {
      name: document.getElementById('group_name').value,
      machines: machines,
      region: document.getElementById('group_region').value,
      storage_type: document.getElementById('group_storage_type').value,
      os: document.getElementById('group_os').value,
      monthly_hours: parseFloat(document.getElementById('group_hours').value) || 730,
      description: document.getElementById('group_description').value,
      include_ai: document.getElementById('group_include_ai').checked,
    };

    try {
      const resp = await fetch('/api/compare-group', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (!resp.ok) throw new Error('API Error ' + resp.status);
      const data = await resp.json();
      renderGroupResults(data);
    } catch (err) {
      alert('比較失敗：' + err.message);
    } finally {
      btn.disabled = false;
      btnText.style.display = 'inline';
      btnLoad.style.display = 'none';
    }
  });

  // ======== Render single-machine results ========
  function renderResults(data) {
    const container = document.getElementById('results-container');
    container.style.display = '';

    // Spec pills
    const pills = document.getElementById('spec-pills');
    const spec = data.spec;
    let pillsHTML = `<span>${spec.cpu_cores} vCPU</span><span>${spec.ram_gb} GB RAM</span>`;
    if (spec.storage_gb > 0) pillsHTML += `<span>${spec.storage_gb} GB ${spec.storage_type.toUpperCase()}</span>`;
    if (spec.network_transfer_gb > 0) pillsHTML += `<span>${spec.network_transfer_gb} GB 流量</span>`;
    pillsHTML += `<span>${spec.region}</span><span>${spec.os.toUpperCase()}</span>`;
    if (spec.database_type !== 'none') pillsHTML += `<span>DB: ${spec.database_type}</span>`;
    pills.innerHTML = pillsHTML;

    // Sort estimates by on-demand price
    const estimates = data.estimates.slice().sort((a, b) => a.total_monthly_on_demand - b.total_monthly_on_demand);
    const maxPrice = Math.max(...estimates.map(e => e.total_monthly_on_demand));

    // Bar chart
    const chart = document.getElementById('price-chart');
    chart.innerHTML = estimates.map(est => {
      const meta = PROVIDER_META[est.provider] || { name: est.provider, color: '#888', bg: '#f0f0f0' };
      const pct = maxPrice > 0 ? (est.total_monthly_on_demand / maxPrice * 100) : 0;
      const isCheapest = est.provider === data.cheapest_on_demand;
      return `
        <div class="chart-row${isCheapest ? ' cheapest' : ''}">
          <div class="chart-label">
            <span class="chart-provider" style="color:${meta.color}">${meta.name}</span>
            <code>${est.matched_instance}</code>
          </div>
          <div class="chart-bar-track">
            <div class="chart-bar" style="width:${pct}%;background:${meta.color}"></div>
          </div>
          <div class="chart-price">$${est.total_monthly_on_demand.toFixed(2)}${isCheapest ? ' <span class="badge-cheapest">最低</span>' : ''}</div>
        </div>
      `;
    }).join('');

    // Provider cards
    const cards = document.getElementById('provider-cards');
    cards.innerHTML = estimates.map(est => {
      const meta = PROVIDER_META[est.provider] || { name: est.provider, color: '#888', bg: '#f0f0f0' };
      const isCheapest = est.provider === data.cheapest_on_demand;
      const isCheapestRes = est.provider === data.cheapest_reserved;
      const details = est.on_demand.details || {};

      let saving = '';
      if (est.total_monthly_reserved_1y != null) {
        const pct = ((1 - est.total_monthly_reserved_1y / est.total_monthly_on_demand) * 100).toFixed(0);
        saving = `<span class="saving">-${pct}%</span>`;
      }

      let warningsHTML = '';
      if (est.warnings && est.warnings.length > 0) {
        warningsHTML = `<div class="card-warnings">${est.warnings.map(w => `<span>&#9888; ${w}</span>`).join('')}</div>`;
      }

      return `
        <div class="provider-card${isCheapest ? ' card-cheapest' : ''}" style="border-top: 3px solid ${meta.color}">
          <div class="card-header">
            <span class="card-provider" style="color:${meta.color}">${meta.name}</span>
            ${isCheapest ? '<span class="badge-cheapest">On-Demand 最低</span>' : ''}
            ${isCheapestRes ? '<span class="badge-reserved">Reserved 最低</span>' : ''}
          </div>
          <div class="card-instance"><code>${est.matched_instance}</code></div>
          <div class="card-region">${est.region_name}</div>
          <div class="card-prices">
            <div class="card-price-block">
              <span class="price-label">On-Demand</span>
              <span class="price-value">$${est.total_monthly_on_demand.toFixed(2)}<span class="price-period">/月</span></span>
              <span class="price-hourly">$${est.on_demand.hourly_cost.toFixed(4)}/hr</span>
            </div>
            ${est.total_monthly_reserved_1y != null ? `
            <div class="card-price-block reserved">
              <span class="price-label">Reserved 1Y ${saving}</span>
              <span class="price-value">$${est.total_monthly_reserved_1y.toFixed(2)}<span class="price-period">/月</span></span>
            </div>
            ` : ''}
          </div>
          <div class="card-breakdown">
            <div class="breakdown-title">費用明細</div>
            <div class="breakdown-row"><span>Compute</span><span>$${(details.compute || 0).toFixed(2)}</span></div>
            ${details.storage > 0 ? `<div class="breakdown-row"><span>Storage</span><span>$${details.storage.toFixed(2)}</span></div>` : ''}
            ${details.network > 0 ? `<div class="breakdown-row"><span>Network</span><span>$${details.network.toFixed(2)}</span></div>` : ''}
            ${details.database > 0 ? `<div class="breakdown-row"><span>Database</span><span>$${details.database.toFixed(2)}</span></div>` : ''}
          </div>
          ${warningsHTML}
        </div>
      `;
    }).join('');

    // AI recommendation
    const aiSection = document.getElementById('ai-section');
    const aiContent = document.getElementById('ai-content');
    if (data.recommendation) {
      aiSection.style.display = '';
      aiContent.innerHTML = data.recommendation.replace(/\n/g, '<br>');
    } else {
      aiSection.style.display = 'none';
    }

    // Scroll to results
    container.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // ======== Render group results ========
  function renderGroupResults(data) {
    const container = document.getElementById('results-container');
    container.style.display = '';

    // Spec pills (group summary)
    const pills = document.getElementById('spec-pills');
    const group = data.group;
    const totalQty = group.machines.reduce((s, m) => s + m.quantity, 0);
    let pillsHTML = `<span>${group.name}</span><span>${totalQty} 台機器</span><span>${group.machines.length} 種規格</span>`;
    pillsHTML += `<span>${group.region}</span><span>${group.os.toUpperCase()}</span>`;
    group.machines.forEach(m => {
      pillsHTML += `<span>${m.name || m.id}: ${m.cpu}C/${m.ram}G x${m.quantity} (${ROLE_LABELS[m.role] || m.role})</span>`;
    });
    pills.innerHTML = pillsHTML;

    // Sort estimates by total on-demand
    const estimates = data.estimates.slice().sort((a, b) => a.total_monthly_on_demand - b.total_monthly_on_demand);
    const maxPrice = Math.max(...estimates.map(e => e.total_monthly_on_demand));

    // Bar chart
    const chart = document.getElementById('price-chart');
    chart.innerHTML = estimates.map(est => {
      const meta = PROVIDER_META[est.provider] || { name: est.provider, color: '#888', bg: '#f0f0f0' };
      const pct = maxPrice > 0 ? (est.total_monthly_on_demand / maxPrice * 100) : 0;
      const isCheapest = est.provider === data.cheapest_on_demand;
      return `
        <div class="chart-row${isCheapest ? ' cheapest' : ''}">
          <div class="chart-label">
            <span class="chart-provider" style="color:${meta.color}">${meta.name}</span>
            <code>${est.total_machines} 台</code>
          </div>
          <div class="chart-bar-track">
            <div class="chart-bar" style="width:${pct}%;background:${meta.color}"></div>
          </div>
          <div class="chart-price">$${est.total_monthly_on_demand.toFixed(2)}${isCheapest ? ' <span class="badge-cheapest">最低</span>' : ''}</div>
        </div>
      `;
    }).join('');

    // Provider cards with machine breakdown
    const cards = document.getElementById('provider-cards');
    cards.innerHTML = estimates.map(est => {
      const meta = PROVIDER_META[est.provider] || { name: est.provider, color: '#888', bg: '#f0f0f0' };
      const isCheapest = est.provider === data.cheapest_on_demand;
      const isCheapestRes = est.provider === data.cheapest_reserved;

      let saving = '';
      if (est.total_monthly_reserved_1y != null) {
        const pct = ((1 - est.total_monthly_reserved_1y / est.total_monthly_on_demand) * 100).toFixed(0);
        saving = `<span class="saving">-${pct}%</span>`;
      }

      // Machine breakdown table
      let machinesHTML = est.machines.map(md => {
        const m = md.machine;
        const roleLabel = ROLE_LABELS[m.role] || m.role;
        return `
          <div class="breakdown-row machine-detail-row">
            <span>
              <span class="role-badge role-${m.role}">${roleLabel}</span>
              ${m.name || m.id}
              <code>${md.matched_instance}</code>
            </span>
            <span>$${md.unit_monthly_on_demand.toFixed(2)} x ${m.quantity} = $${md.subtotal_on_demand.toFixed(2)}</span>
          </div>
        `;
      }).join('');

      let warningsHTML = '';
      if (est.warnings && est.warnings.length > 0) {
        warningsHTML = `<div class="card-warnings">${est.warnings.map(w => `<span>&#9888; ${w}</span>`).join('')}</div>`;
      }

      return `
        <div class="provider-card group-card${isCheapest ? ' card-cheapest' : ''}" style="border-top: 3px solid ${meta.color}">
          <div class="card-header">
            <span class="card-provider" style="color:${meta.color}">${meta.name}</span>
            ${isCheapest ? '<span class="badge-cheapest">On-Demand 最低</span>' : ''}
            ${isCheapestRes ? '<span class="badge-reserved">Reserved 最低</span>' : ''}
          </div>
          <div class="card-region">${est.region_name} — ${est.total_machines} 台機器</div>
          <div class="card-prices">
            <div class="card-price-block">
              <span class="price-label">ON-DEMAND 總計</span>
              <span class="price-value">$${est.total_monthly_on_demand.toFixed(2)}<span class="price-period">/月</span></span>
            </div>
            ${est.total_monthly_reserved_1y != null ? `
            <div class="card-price-block reserved">
              <span class="price-label">Reserved 1Y 總計 ${saving}</span>
              <span class="price-value">$${est.total_monthly_reserved_1y.toFixed(2)}<span class="price-period">/月</span></span>
            </div>
            ` : ''}
          </div>
          <div class="card-breakdown">
            <div class="breakdown-title">每台明細</div>
            ${machinesHTML}
          </div>
          ${warningsHTML}
        </div>
      `;
    }).join('');

    // AI recommendation
    const aiSection = document.getElementById('ai-section');
    const aiContent = document.getElementById('ai-content');
    if (data.recommendation) {
      aiSection.style.display = '';
      aiContent.innerHTML = data.recommendation.replace(/\n/g, '<br>');
    } else {
      aiSection.style.display = 'none';
    }

    container.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // Auto-render server-side data if present (form POST fallback)
  const ssrEl = document.getElementById('ssr-data');
  if (ssrEl) {
    try {
      const data = JSON.parse(ssrEl.textContent);
      renderResults(data);
    } catch(e) { /* ignore parse errors */ }
  }
})();
</script>
</body>
</html>
