[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudcost"
version = "0.6.3"
description = "Multi-cloud cost comparison and AI recommendation engine"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.25",
    "anthropic>=0.40",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.25",
]

[project.scripts]
cloudcost = "cloudcost.cli:main"
cloudcost-web = "cloudcost.web.app:start"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
